[build]
  base = "frontend"
  publish = ".next"
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_DISABLE_AUTH = "true"

[[redirects]]
  from = "/api/*"
  to = "https://finpilot-backend.onrender.com/api/:splat"
  status = 200
  force = false
